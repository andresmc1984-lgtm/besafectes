<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-SAFE - Clasificación de Alacranes (Modo Difícil)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ficha-arrastrable {
            cursor: grab;
        }
        .ficha-arrastrable:active {
            cursor: grabbing;
        }
        .zona-activa {
            background-color: rgba(59, 130, 246, 0.1); 
        }
        .fade-in {
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4">

    <main class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mt-4">
        
        <!-- Encabezado -->
        <div class="bg-yellow-500 text-white p-4 text-center">
            <h1 class="text-2xl font-bold">🦂 Módulo 2: Clasifica al Enemigo</h1>
            <p class="text-sm font-medium">¡Atención! Hay características que son mitos o pistas falsas. Déjalas en el banco.</p>
        </div>

        <div class="p-4 md:p-6 text-center">
            
            <!-- Imagen Oculta (Aparece al ganar) -->
            <div id="contenedor-imagen" class="hidden mb-6 flex flex-col items-center fade-in">
                <h3 class="text-green-600 font-bold text-xl mb-2">¡Misión Cumplida! Esta es la guía oficial:</h3>
                <img src="img/alacran1.jfif" alt="Diferencias Alacranes" class="max-h-80 rounded-lg shadow-lg border-4 border-green-500">
            </div>

            <!-- Banco de características -->
            <p id="instruccion" class="mb-4 text-gray-700 font-medium">Arrastra solo las características reales a su columna. Deja los MITOS aquí:</p>
            
            <div id="banco-caracteristicas" class="flex flex-wrap justify-center gap-3 mb-8 min-h-[120px] p-4 bg-gray-50 border-2 border-dashed border-gray-400 rounded-xl transition-colors" data-columna="banco" ondrop="soltar(event)" ondragover="permitirSoltar(event)" ondragleave="quitarResaltado(event)">
                <!-- Las fichas se inyectan aquí con JS -->
            </div>

            <!-- Zonas de caída (Columnas) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Columna: NO PELIGROSO -->
                <div id="columna-no-peligroso" data-columna="no-peligroso" class="border-4 border-dashed border-green-300 rounded-xl p-4 min-h-[300px] flex flex-col bg-green-50/30 transition-colors" ondrop="soltar(event)" ondragover="permitirSoltar(event)" ondragleave="quitarResaltado(event)">
                    <h2 class="text-xl font-bold text-green-700 mb-4 border-b-2 border-green-200 pb-2 w-full text-center pointer-events-none">🟢 NO PELIGROSO</h2>
                    <div class="contenedor-fichas flex flex-col gap-2 flex-grow pointer-events-none"></div>
                </div>

                <!-- Columna: PELIGROSO -->
                <div id="columna-peligroso" data-columna="peligroso" class="border-4 border-dashed border-red-300 rounded-xl p-4 min-h-[300px] flex flex-col bg-red-50/30 transition-colors" ondrop="soltar(event)" ondragover="permitirSoltar(event)" ondragleave="quitarResaltado(event)">
                    <h2 class="text-xl font-bold text-red-700 mb-4 border-b-2 border-red-200 pb-2 w-full text-center pointer-events-none">🔴 PELIGROSO</h2>
                    <div class="contenedor-fichas flex flex-col gap-2 flex-grow pointer-events-none"></div>
                </div>

            </div>

            <!-- Mensaje de estado -->
            <div id="mensaje-juego" class="mt-6 text-lg font-bold min-h-[2rem]"></div>

            <!-- Botón Comprobar (Siempre visible para que prueben cuando quieran) -->
            <button id="btn-comprobar" onclick="comprobarResultados()" class="mx-auto mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition transform hover:scale-105">
                Comprobar Respuestas
            </button>

            <!-- Botón para avanzar (Oculto al inicio) -->
            <div id="seccion-continuar" class="hidden mt-8 fade-in">
                <a href="alacran2.html" class="inline-block bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                    Continuar
                </a>
            </div>

        </div>
    </main>

    <script>
        // Datos de las fichas (Añadimos pistas falsas tipo="falso")
        const caracteristicas = [
            { id: 'f1', texto: "Pinzas cortas y anchas", tipo: "no-peligroso" },
            { id: 'f2', texto: "Pinzas delgadas y largas", tipo: "peligroso" },
            { id: 'f3', texto: "Aguijón con punta simple", tipo: "no-peligroso" },
            { id: 'f4', texto: "Aguijón con púa (doble aguijón)", tipo: "peligroso" },
            { id: 'f5', texto: "Color marrón oscuro a negro", tipo: "no-peligroso" },
            { id: 'f6', texto: "Color amarillo o marrón claro", tipo: "peligroso" },
            { id: 'f7', texto: "Líneas longitudinales en el dorso", tipo: "peligroso" },
            { id: 'f8', texto: "Dorso liso del mismo color", tipo: "no-peligroso" },
            { id: 'f9', texto: "Tienen antenas largas ", tipo: "falso" }, // Pista falsa
            { id: 'f10', texto: "Saltan hacia su presa ", tipo: "falso" } // Pista falsa
        ];

        function iniciarJuego() {
            const banco = document.getElementById('banco-caracteristicas');
            caracteristicas.sort(() => Math.random() - 0.5); 

            caracteristicas.forEach(caract => {
                const ficha = document.createElement('div');
                // Estilo neutro, sin colores de acierto o error
                ficha.className = "ficha-arrastrable bg-white border-2 border-gray-300 rounded-lg p-3 shadow-sm text-sm font-semibold text-gray-700 hover:border-blue-400 hover:shadow-md transition-all text-center flex-grow sm:flex-grow-0 min-w-[140px]";
                ficha.textContent = caract.texto;
                ficha.id = caract.id;
                ficha.dataset.tipo = caract.tipo;
                ficha.draggable = true;
                ficha.ondragstart = arrastrar;
                
                banco.appendChild(ficha);
            });
        }

        // --- FUNCIONES DE DRAG AND DROP ---
        function permitirSoltar(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('zona-activa');
        }

        function quitarResaltado(ev) {
            ev.currentTarget.classList.remove('zona-activa');
        }

        function arrastrar(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
            ev.target.style.opacity = "0.5";
            // Limpiamos el mensaje de error si empiezan a mover fichas de nuevo
            document.getElementById('mensaje-juego').textContent = "";
        }

        function soltar(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('zona-activa');
            
            const data = ev.dataTransfer.getData("text");
            const fichaElemento = document.getElementById(data);
            fichaElemento.style.opacity = "1"; 

            // Si se suelta en el banco principal
            if (ev.currentTarget.id === 'banco-caracteristicas') {
                ev.currentTarget.appendChild(fichaElemento);
            } else {
                // Si se suelta en una de las columnas
                const contenedorDestino = ev.currentTarget.querySelector('.contenedor-fichas');
                if (contenedorDestino) {
                    contenedorDestino.appendChild(fichaElemento);
                }
            }
        }

        // --- LÓGICA DE VALIDACIÓN (Modo Difícil) ---
        function comprobarResultados() {
            let todosCorrectos = true;
            const todasLasFichas = document.querySelectorAll('.ficha-arrastrable');
            
            todasLasFichas.forEach(ficha => {
                const tipoCorrecto = ficha.dataset.tipo;
                const contenedorPadre = ficha.parentElement;
                
                // Determinamos en qué zona está la ficha evaluando a su "abuelo" o padre directo
                let zonaActual = "banco";
                if (contenedorPadre.classList.contains('contenedor-fichas')) {
                    zonaActual = contenedorPadre.parentElement.dataset.columna;
                }

                // Evaluamos si está en el lugar correcto
                if (tipoCorrecto === "falso") {
                    // Las pistas falsas DEBEN quedarse en el banco
                    if (zonaActual !== "banco") {
                        todosCorrectos = false;
                    }
                } else {
                    // Las verdaderas DEBEN estar en su columna correspondiente
                    if (zonaActual !== tipoCorrecto) {
                        todosCorrectos = false;
                    }
                }
            });

            const mensajeDiv = document.getElementById('mensaje-juego');

            if (todosCorrectos) {
                // GANÓ EL JUEGO
                mensajeDiv.textContent = "¡Excelente deducción! Esquivaste las trampas y clasificaste todo perfecto.";
                mensajeDiv.className = "mt-6 text-xl font-bold text-green-600";
                
                document.getElementById('btn-comprobar').classList.add('hidden');
                document.getElementById('banco-caracteristicas').classList.add('hidden');
                document.getElementById('instruccion').classList.add('hidden');

                document.getElementById('contenedor-imagen').classList.remove('hidden');
                document.getElementById('seccion-continuar').classList.remove('hidden');
                
                todasLasFichas.forEach(f => {
                    f.draggable = false;
                    f.classList.remove('ficha-arrastrable', 'hover:border-blue-400');
                    f.classList.add('cursor-default', 'bg-green-50', 'border-green-300'); // Pintamos todo de verde solo al ganar
                });
                
            } else {
                // ERROR: Mensaje genérico, sin pintar colores
                mensajeDiv.textContent = "❌ Algo no está bien. Vuelve a intentar y trata de acomodar de nuevo. Recuerda que hay pistas falsas.";
                mensajeDiv.className = "mt-6 text-lg font-bold text-red-600 fade-in";
            }
        }

        window.onload = iniciarJuego;
    </script>
</body>
</html>
