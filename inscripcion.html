<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Acreditación al Evento | B-Safe Corrientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Configuramos colores personalizados de Tailwind basados en la tarjeta -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#00a9e0',
              dark: '#153e75',
              light: '#aaddf0'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4 sm:p-8 font-sans">

  <!-- Contenedor Principal estilo "App/Tarjeta" -->
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col relative">
    
    <!-- Cabecera (Sección Superior Cyan) -->
    <div class="bg-brand-cyan text-white p-6 pb-10 relative z-10 shadow-md">
      <div class="flex justify-between items-start mb-6">
        <div class="text-3xl font-extrabold tracking-tighter lowercase">personal</div>
        <div class="text-right text-sm leading-tight font-semibold">
          Seguridad, Salud<br>Ocupacional<br>y Bienestar
        </div>
      </div>
      <h1 class="text-4xl font-bold mb-1">B-Safe</h1>
      <h2 class="text-3xl font-black tracking-wide uppercase">Corrientes</h2>
    </div>

    <!-- Sección del Formulario -->
    <div class="p-6 pt-10 flex-grow bg-gray-50 relative -mt-4 rounded-t-3xl z-20">
      
      <div class="text-center mb-8">
        <h3 class="text-xl font-bold text-gray-800 uppercase tracking-wider">Auto-Acreditación</h3>
        <p class="text-gray-500 text-sm mt-2">Ingresa tu número de legajo para validar tu ingreso al evento</p>
      </div>

      <form id="formValidacion" class="space-y-6">
        <div>
          <!-- Input adaptado al estilo del recuadro blanco de la tarjeta -->
          <input 
            type="text" 
            inputmode="numeric" 
            id="legajo" 
            name="legajo" 
            required 
            placeholder="Nº DE LEGAJO"
            class="w-full px-4 py-4 rounded-xl border-2 border-gray-300 focus:ring-0 focus:border-brand-cyan outline-none transition text-2xl text-center font-bold text-gray-800 tracking-widest shadow-sm bg-white"
            autocomplete="off"
            autofocus
          >
        </div>

        <button 
          type="submit" 
          id="btnSubmit"
          class="w-full bg-brand-dark hover:bg-blue-900 text-white font-bold py-4 px-4 rounded-xl transition duration-300 flex items-center justify-center space-x-2 shadow-lg hover:shadow-xl text-lg uppercase tracking-wide"
        >
          <span id="btnText">Validar Ingreso</span>
          <div id="btnSpinner" class="hidden w-6 h-6 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </form>

      <div id="resultado" class="hidden mt-6 p-4 rounded-xl text-center text-sm font-medium shadow-sm"></div>
    </div>

    <!-- Pie de página (Sección Inferior con Iconos) -->
    <div class="flex bg-brand-light text-brand-dark h-16">
      
      <!-- Fecha -->
      <div class="flex-1 flex items-center">
        <div class="bg-brand-dark text-white h-full w-16 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <div class="flex-1 text-center font-bold text-sm px-2">
          15 de septiembre 2026
        </div>
      </div>

      <!-- Ubicación -->
      <div class="flex-1 flex items-center border-l-2 border-white/40">
        <div class="bg-brand-dark text-white h-full w-16 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <div class="flex-1 text-center font-bold text-sm px-2">
          Corrientes
        </div>
      </div>
      
    </div>
  </div>

  <script>
    // URL de tu Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdr2pSNl9y2jfG4J09hqFyrQ-0ru1O_U4QxxInZZ7LBqCS7t15CusHD1Sm6nFkonD31g/exec";

    const form = document.getElementById("formValidacion");
    const inputLegajo = document.getElementById("legajo");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const resultado = document.getElementById("resultado");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const legajo = inputLegajo.value.trim();
      if (!legajo) return;

      setLoading(true);
      resultado.className = "hidden";

      try {
        const queryUrl = `${SCRIPT_URL}?legajo=${encodeURIComponent(legajo)}`;
        const response = await fetch(queryUrl);
        const data = await response.json();

        if (data.status === "success") {
          const detalle = data.nombre ? `<br><span class="text-lg">Bienvenido/a <strong>${data.nombre}</strong></span>` : "";
          mostrarMensaje("success", `¡Registro realizado con éxito! ${detalle}`);
          inputLegajo.value = "";
        } else if (data.status === "already_registered") {
          const detalle = data.nombre ? `(${data.nombre})` : "";
          mostrarMensaje("warning", `Aviso: ${data.message} ${detalle}`);
        } else {
          mostrarMensaje("error", data.message || "Legajo no encontrado en el padrón.");
        }

      } catch (err) {
        console.error(err);
        mostrarMensaje("error", "Error de conexión con la base de datos. Verifica la configuración de acceso en Apps Script.");
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      btnSubmit.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = "Verificando...";
        btnSpinner.classList.remove("hidden");
        btnSubmit.classList.add("opacity-75", "cursor-not-allowed");
      } else {
        btnText.textContent = "Validar Ingreso";
        btnSpinner.classList.add("hidden");
        btnSubmit.classList.remove("opacity-75", "cursor-not-allowed");
      }
    }

    function mostrarMensaje(tipo, textoHtml) {
      resultado.classList.remove("hidden");
      if (tipo === "success") {
        resultado.className = "mt-6 p-4 rounded-xl text-center font-medium bg-green-100 text-green-800 border-2 border-green-300 shadow-sm";
      } else if (tipo === "warning") {
        resultado.className = "mt-6 p-4 rounded-xl text-center font-medium bg-yellow-100 text-yellow-800 border-2 border-yellow-300 shadow-sm";
      } else {
        resultado.className = "mt-6 p-4 rounded-xl text-center font-medium bg-red-100 text-red-800 border-2 border-red-300 shadow-sm";
      }
      resultado.innerHTML = textoHtml;
    }
  </script>
</body>
</html>
