<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección de Cajas | B-SAFE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Efecto de giro 3D para la caja */
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-slate-100 min-h-screen flex flex-col p-4 md:p-8 font-sans">

    <header class="w-full max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 py-4 border-b border-slate-700/60 mb-6">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-500/20 text-emerald-400 p-2.5 rounded-xl border border-emerald-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <div>
                <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold block">Jornada de Prevención</span>
                <span class="text-2xl font-black tracking-tight text-white">B-SAFE CORRIENTES</span>
            </div>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 px-4 py-1.5 rounded-full text-xs font-semibold text-slate-300 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            ÁREA DE SALUD Y BIENESTAR
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center w-full max-w-5xl mx-auto">
        <div class="w-full text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-500 mb-2">
                Simulador de Inspección en Terreno
            </h1>
            <p class="text-lg text-slate-300">
                Toca cada caja de distribución para abrirla. Identifica rápidamente si el espécimen es un <span class="font-bold text-red-400">Peligro Biológico</span> o es <span class="font-bold text-emerald-400">Inofensiva</span>.
            </p>
            <div id="progressStatus" class="mt-4 font-bold text-amber-400 text-lg">
                Cajas inspeccionadas: 0 / 6
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full perspective" id="gameGrid">
            </div>

        <div class="mt-10 mb-6 h-16 flex justify-center w-full">
            <a href="arana2.html" id="nextBtn"
               class="hidden items-center justify-center gap-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-lg px-8 py-4 rounded-xl shadow-lg shadow-emerald-500/20 transform hover:-translate-y-0.5 transition-all duration-200 w-full sm:w-auto">
                <span>Continuar al Protocolo de Picaduras</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </a>
        </div>
    </main>

    <script>
        // Base de datos de arañas con los nombres exactos de tus archivos
        const spiders = [
            { id: 'viuda', name: 'Viuda Negra', img: 'img/viuda_negra.png', isDangerous: true },
            { id: 'loxocele', name: 'Araña de los Rincones', img: 'img/loxocele.jpg', isDangerous: true },
            { id: 'bananera', name: 'Araña Bananera', img: 'img/bananera.jpg', isDangerous: true },
            { id: 'lobo', name: 'Araña Lobo', img: 'img/arañalobo.jpg', isDangerous: false },
            { id: 'tarantula', name: 'Tarántula', img: 'img/tarantula.jpg', isDangerous: false },
            { id: 'patalarga', name: 'Araña Pata Larga', img: 'img/patalarga.jpg', isDangerous: false }
        ];

        // Mezclar aleatoriamente para que no siempre salgan en el mismo orden
        spiders.sort(() => Math.random() - 0.5);

        let evaluatedCount = 0;
        const grid = document.getElementById('gameGrid');
        const progressStatus = document.getElementById('progressStatus');
        const nextBtn = document.getElementById('nextBtn');

        // Generar las cajas
        spiders.forEach((spider, index) => {
            const card = document.createElement('div');
            card.className = "relative w-full h-80 rounded-xl preserve-3d transition-transform duration-700 cursor-pointer";
            card.id = `card-${index}`;

            // Cara Frontal (Caja Cerrada)
            const frontFace = `
                <div class="absolute w-full h-full backface-hidden bg-slate-700 border-2 border-slate-600 rounded-xl shadow-lg flex flex-col items-center justify-center p-4 hover:bg-slate-600 transition-colors" onclick="openBox(${index})">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                    </svg>
                    <span class="text-slate-300 font-bold uppercase tracking-wider">Caja Telecom ${index + 1}</span>
                    <span class="text-sm text-amber-500 mt-2 animate-pulse">Tocar para abrir</span>
                </div>
            `;

            // Cara Trasera (Araña Descubierta)
            const backFace = `
                <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-slate-800 border-2 border-slate-700 rounded-xl shadow-xl flex flex-col overflow-hidden">
                    <img src="${spider.img}" alt="${spider.name}" class="w-full h-40 object-cover bg-slate-900" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23475569\\'/></svg>'">
                    <div class="p-3 text-center flex-grow flex flex-col justify-between" id="content-${index}">
                        <h3 class="font-bold text-slate-100 text-lg leading-tight mb-2">¿Es peligrosa?</h3>
                        <div class="flex gap-2 w-full">
                            <button onclick="evaluateSpider(${index}, true, ${spider.isDangerous}, '${spider.name}')" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg text-sm transition-colors shadow-md">Peligro</button>
                            <button onclick="evaluateSpider(${index}, false, ${spider.isDangerous}, '${spider.name}')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition-colors shadow-md">Inofensiva</button>
                        </div>
                    </div>
                </div>
            `;

            card.innerHTML = frontFace + backFace;
            grid.appendChild(card);
        });

        // Función para voltear la carta
        function openBox(index) {
            const card = document.getElementById(`card-${index}`);
            card.classList.add('rotate-y-180');
            // Quitar el evento de click de la parte frontal para que no interfiera
            card.querySelector('.backface-hidden').onclick = null;
        }

        // Función para evaluar la respuesta
        function evaluateSpider(index, userChoice, isActuallyDangerous, spiderName) {
            const contentDiv = document.getElementById(`content-${index}`);
            const isCorrect = userChoice === isActuallyDangerous;
            
            evaluatedCount++;
            progressStatus.innerText = `Cajas inspeccionadas: ${evaluatedCount} / 6`;

            let resultHTML = '';
            if (isCorrect) {
                resultHTML = `
                    <div class="flex flex-col items-center justify-center h-full">
                        <svg class="w-10 h-10 text-emerald-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        <span class="font-bold text-emerald-400 text-lg">¡Correcto!</span>
                        <span class="text-slate-300 text-sm font-semibold">${spiderName}</span>
                    </div>
                `;
                document.getElementById(`card-${index}`).querySelector('.rotate-y-180').classList.replace('border-slate-700', 'border-emerald-500');
            } else {
                resultHTML = `
                    <div class="flex flex-col items-center justify-center h-full">
                        <svg class="w-10 h-10 text-red-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                        <span class="font-bold text-red-400 text-lg">¡Error!</span>
                        <span class="text-slate-300 text-sm font-semibold">${spiderName}</span>
                    </div>
                `;
                document.getElementById(`card-${index}`).querySelector('.rotate-y-180').classList.replace('border-slate-700', 'border-red-500');
            }

            contentDiv.innerHTML = resultHTML;

            // Verificar si terminó el juego
            if (evaluatedCount === 6) {
                progressStatus.innerText = "¡Inspección Completa!";
                progressStatus.classList.replace('text-amber-400', 'text-emerald-400');
                nextBtn.classList.remove('hidden');
                nextBtn.classList.add('inline-flex'); // Mostrar el botón con flex
                
                // Hacer scroll suave hacia el botón para pantallas pequeñas
                setTimeout(() => {
                    nextBtn.scrollIntoView({ behavior: 'smooth' });
                }, 500);
            }
        }
    </script>
</body>
</html>
