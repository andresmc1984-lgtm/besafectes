<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-SAFE - Simulador de Decisiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 text-white font-sans min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-lg bg-white text-gray-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Encabezado -->
        <div class="bg-red-600 text-white p-4 text-center">
            <h1 class="text-2xl font-bold">🚨 Simulador B-SAFE</h1>
            <p class="text-sm opacity-90">Decisiones de vida o muerte en terreno</p>
        </div>

        <div class="p-6">
            
            <!-- Contador de nivel -->
            <div class="flex justify-between items-center mb-4 text-sm font-bold text-gray-500">
                <span id="nivel-texto">Situación 1 de 3</span>
                <div class="flex space-x-1" id="indicadores">
                    <div class="w-3 h-3 rounded-full bg-red-600"></div>
                    <div class="w-3 h-3 rounded-full bg-gray-300"></div>
                    <div class="w-3 h-3 rounded-full bg-gray-300"></div>
                </div>
            </div>

            <!-- Contenedor del Juego -->
            <div id="pantalla-juego">
                <h2 id="pregunta-texto" class="text-xl font-bold mb-6 text-gray-800 leading-tight">
                    <!-- Aquí va la pregunta generada por JS -->
                </h2>

                <div class="space-y-3">
                    <button id="btn-opcion1" onclick="evaluarRespuesta(1)" class="w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 transition duration-200 font-medium text-gray-700">
                        <!-- Opción 1 -->
                    </button>
                    
                    <button id="btn-opcion2" onclick="evaluarRespuesta(2)" class="w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 transition duration-200 font-medium text-gray-700">
                        <!-- Opción 2 -->
                    </button>
                </div>
            </div>

            <!-- Pantalla de Feedback (Oculta) -->
            <div id="pantalla-feedback" class="hidden text-center py-4">
                <div id="icono-feedback" class="text-6xl mb-4"></div>
                <h2 id="titulo-feedback" class="text-2xl font-bold mb-2"></h2>
                <p id="texto-feedback" class="text-gray-600 mb-6"></p>
                <button id="btn-continuar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg">
                    Continuar
                </button>
            </div>

            <!-- Pantalla Final (Oculta) -->
            <div id="pantalla-final" class="hidden text-center py-6">
                <div class="text-6xl mb-4">🏆</div>
                <h2 class="text-2xl font-bold text-green-600 mb-2">¡Técnico Seguro!</h2>
                <p class="text-gray-600 mb-6">Sabes cómo manejarte en el terreno para evitar accidentes con víboras.</p>
                <a href="alacranes1.html" class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-4 rounded-xl transition shadow-lg text-lg">
                    Pasar al módulo Alacranes 🦂
                </a>
            </div>

        </div>
    </main>

    <script>
        // La base de datos de nuestro juego (Tus recomendaciones camufladas en escenarios)
        const escenarios = [
            {
                pregunta: "Llegas al domicilio y debes revisar una cámara subterránea que está llena de hojas secas y basura. ¿Qué haces?",
                opcion1: "Me pongo mis guantes de vaqueta e introduzco las manos para despejar la zona rápidamente.",
                opcion2: "Uso un destornillador largo o vara para remover las hojas y observo bien antes de meter la mano.",
                correcta: 2,
                explicacionPositiva: "¡Correcto! Nunca metes las manos a ciegas. La inspección visual y el uso de herramientas son tu mejor defensa.",
                explicacionNegativa: "¡Peligro! Los guantes ayudan, pero si hay una yarará escondida, un ataque sorpresivo puede perforarlos o darte en el antebrazo. Nunca a ciegas."
            },
            {
                pregunta: "Mientras tiras fibra por una pared exterior, ves una serpiente Yarará descansando sobre los ladrillos a 2 metros tuyos.",
                opcion1: "Mantengo la distancia de 2 metros, retrocedo lentamente y le aviso al cliente y a mi supervisor.",
                opcion2: "Intento asustarla tirándole piedras o capturarla con un palo para proteger al cliente.",
                correcta: 1,
                explicacionPositiva: "¡Excelente! Las víboras no atacan si no se sienten amenazadas. Alejarse y avisar es el protocolo correcto.",
                explicacionNegativa: "¡Error grave! La mayoría de los accidentes ocurren cuando alguien intenta matar o capturar a la serpiente. Mantén la distancia."
            },
            {
                pregunta: "¡Emergencia! Un compañero pisó una serpiente por accidente y fue mordido en la mano.",
                opcion1: "Le quito rápido el reloj y anillos, le lavo con agua, inmovilizo el brazo y lo llevo urgente al hospital.",
                opcion2: "Le hago un torniquete en el brazo con un cable de red y trato de succionar el veneno para ayudarlo.",
                correcta: 1,
                explicacionPositiva: "¡Perfecto! Liberar la zona antes de que se inflame y lavar es lo único que debes hacer antes de ir al hospital.",
                explicacionNegativa: "¡Mito mortal! El torniquete concentra el veneno causando necrosis (puede perder el brazo) y succionar te pone en riesgo a ti."
            }
        ];

        let pasoActual = 0;

        // Referencias al DOM
        const pantallaJuego = document.getElementById('pantalla-juego');
        const pantallaFeedback = document.getElementById('pantalla-feedback');
        const pantallaFinal = document.getElementById('pantalla-final');
        const preguntaTexto = document.getElementById('pregunta-texto');
        const btnOpcion1 = document.getElementById('btn-opcion1');
        const btnOpcion2 = document.getElementById('btn-opcion2');
        const indicadores = document.getElementById('indicadores').children;
        const nivelTexto = document.getElementById('nivel-texto');

        // Función para cargar el escenario
        function cargarEscenario() {
            pantallaFeedback.classList.add('hidden');
            pantallaJuego.classList.remove('hidden');
            
            const escenario = escenarios[pasoActual];
            preguntaTexto.textContent = escenario.pregunta;
            btnOpcion1.textContent = "A) " + escenario.opcion1;
            btnOpcion2.textContent = "B) " + escenario.opcion2;
            
            nivelTexto.textContent = `Situación ${pasoActual + 1} de ${escenarios.length}`;
            
            // Actualizar indicadores visuales (los puntitos)
            for (let i = 0; i < indicadores.length; i++) {
                indicadores[i].className = i === pasoActual ? 'w-3 h-3 rounded-full bg-red-600' : 'w-3 h-3 rounded-full bg-gray-300';
            }
        }

        // Función cuando el usuario hace clic en un botón
        function evaluarRespuesta(elegida) {
            const escenario = escenarios[pasoActual];
            const esCorrecta = (elegida === escenario.correcta);

            pantallaJuego.classList.add('hidden');
            pantallaFeedback.classList.remove('hidden');

            const icono = document.getElementById('icono-feedback');
            const titulo = document.getElementById('titulo-feedback');
            const texto = document.getElementById('texto-feedback');
            const btnContinuar = document.getElementById('btn-continuar');

            if (esCorrecta) {
                icono.textContent = "✅";
                titulo.textContent = "¡Bien hecho!";
                titulo.className = "text-2xl font-bold mb-2 text-green-600";
                texto.textContent = escenario.explicacionPositiva;
                
                // Si acertó, preparamos el botón para avanzar al siguiente nivel
                btnContinuar.textContent = "Siguiente Situación";
                btnContinuar.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg";
                btnContinuar.onclick = avanzarNivel;
            } else {
                icono.textContent = "❌";
                titulo.textContent = "¡Cometiste un error!";
                titulo.className = "text-2xl font-bold mb-2 text-red-600";
                texto.textContent = escenario.explicacionNegativa;
                
                // Si falló, preparamos el botón para reintentar
                btnContinuar.textContent = "Reintentar";
                btnContinuar.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg";
                btnContinuar.onclick = cargarEscenario; // Vuelve a cargar el mismo nivel
            }
        }

        function avanzarNivel() {
            pasoActual++;
            if (pasoActual < escenarios.length) {
                cargarEscenario();
            } else {
                // Ganó el juego
                pantallaFeedback.classList.add('hidden');
                document.getElementById('nivel-texto').parentElement.classList.add('hidden');
                pantallaFinal.classList.remove('hidden');
            }
        }

        // Iniciar el juego
        cargarEscenario();
    </script>
</body>
</html>
