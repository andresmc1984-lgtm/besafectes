<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escape Room - Game Over</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sobreescribimos algunos colores a rojo coral solo para esta pantalla */
        .door-container {
            border-color: #ff6b6b;
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.4);
        }
        h2 {
            color: #ff6b6b;
        }
        button {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        button:hover {
            background: rgba(255, 107, 107, 0.1);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.4);
        }
    </style>
</head>
<body>
    <div class="door-container">
        <h2 style="font-size: 2.5rem;">BLOQUEO CRÍTICO</h2>
        <p>El tiempo se ha agotado. Las medidas de seguridad han sido activadas y tu conexión fue interceptada de forma definitiva.</p>
        
        <h1 style="color: #ff6b6b; font-size: 3.5rem; margin: 30px 0; letter-spacing: 5px;">GAME OVER</h1>
        
        <button onclick="reiniciarJuego()">REINTENTAR</button>
    </div>

    <script>
        // Nos aseguramos de limpiar el temporizador aquí también por seguridad
        localStorage.removeItem("escapeTimeLeft");

        function reiniciarJuego() {
            // Cambia "puerta1.html" por "index.html" si tienes una portada
            window.location.href = "puerta1.html"; 
        }
    </script>
</body>
</html>
