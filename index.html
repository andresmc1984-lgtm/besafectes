<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card con Botones Modernos</title>
    <style>
        /* Fondo azul marino y centrado de la card */
        body {
            background-color: #0b132b; /* Azul marino moderno */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Estilo de la Card */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); /* Sombra para dar profundidad */
            width: 100%;
            max-width: 500px;
        }

        .card-title {
            text-align: center;
            color: #1c1c1c;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* Grid para organizar los 8 botones (2 columnas x 4 filas) */
        .button-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }

        /* Estilos modernos para los botones */
        .btn {
            background-color: #1c2541; /* Azul un poco más claro para el botón */
            color: #ffffff;
            border: none;
            border-radius: 8px; /* Bordes redondeados */
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none; /* Quita el subrayado de los enlaces */
            transition: all 0.3s ease; /* Transición suave para los efectos */
            display: inline-block;
        }

        /* Efecto al pasar el cursor (Hover) */
        .btn:hover {
            background-color: #3a506b;
            transform: translateY(-3px); /* Eleva el botón ligeramente */
            box-shadow: 0 6px 15px rgba(58, 80, 107, 0.4);
            color: #ffffff; 
        }

        /* Efecto al hacer clic (Active) */
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(58, 80, 107, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="card-title">Panel de Control</h2>
        
        <div class="button-container">
            <a href="catastrofe.html" class="btn">catastrofe</a>
            
            <button type="button" class="btn">Botón 2</button>
            <button type="button" class="btn">Botón 3</button>
            <button type="button" class="btn">Botón 4</button>
            <button type="button" class="btn">Botón 5</button>
            <button type="button" class="btn">Botón 6</button>
            <button type="button" class="btn">Botón 7</button>
            <button type="button" class="btn">Botón 8</button>
        </div>
    </div>

</body>
</html>
