<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Juego: Escape del Galpón</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .game-container {
            background-color: #34495e;
            border-radius: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h1 { color: #f1c40f; margin-bottom: 5px;}
        #timer { font-size: 2em; color: #e74c3c; font-weight: bold; margin: 10px 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .item {
            background-color: #ecf0f1;
            font-size: 3em;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        .item:hover { transform: scale(1.05); }
        .hidden-animal { font-size: 0.5em; display: block; margin-top: 10px; }
        #message { font-size: 1.2em; margin-top: 20px; min-height: 30px; color: #2ecc71;}
        .btn-start {
            background-color: #f1c40f; color: #2c3e50; border: none;
            padding: 15px 30px; font-size: 1.2em; font-weight: bold;
            border-radius: 5px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🔦 El Galpón del Peligro</h1>
    <p>¡Tienes 20 segundos para encontrar los 3 escondites peligrosos tocando los objetos!</p>
    
    <div id="timer">20</div>
    <div id="message">Toca "Empezar" cuando el equipo esté listo.</div>
    
    <button class="btn-start" id="startBtn" onclick="startGame()">¡Empezar a Buscar!</button>

    <div class="grid" id="grid" style="display:none;">
        <div class="item" onclick="checkItem(this, false, '¡Mesa limpia! Zona segura.')">🪑</div>
        <div class="item" onclick="checkItem(this, true, '¡CUIDADO! Un alacrán en la zapatilla. 🦂')">👟</div>
        <div class="item" onclick="checkItem(this, false, 'Solo es una maceta vacía.')">🪴</div>
        <div class="item" onclick="checkItem(this, true, '¡ALERTA! Araña de los rincones en la ropa tirada. 🕷️')">👕</div>
        <div class="item" onclick="checkItem(this, false, 'Herramientas seguras.')">🔨</div>
        <div class="item" onclick="checkItem(this, true, '¡PELIGRO! Una yarará entre los escombros. 🐍')">🧱</div>
    </div>
</div>

<script>
    let timeLeft = 20;
    let timerId;
    let found = 0;
    let isPlaying = false;

    function startGame() {
        timeLeft = 20;
        found = 0;
        isPlaying = true;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('message').innerText = "¡Buscando!";
        document.getElementById('message').style.color = "#f1c40f";
        
        // Reset items
        const items = document.querySelectorAll('.item');
        items.forEach(item => {
            item.style.backgroundColor = "#ecf0f1";
            item.style.pointerEvents = "auto";
            if(item.querySelector('.hidden-animal')) {
                item.querySelector('.hidden-animal').remove();
            }
        });

        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame(false);
        }, 1000);
    }

    function checkItem(element, isDanger, msg) {
        if (!isPlaying) return;
        
        document.getElementById('message').innerText = msg;
        element.style.pointerEvents = "none"; // Disable clicking again

        if (isDanger) {
            element.style.backgroundColor = "#e74c3c";
            found++;
            if (found === 3) {
                endGame(true);
            }
        } else {
            element.style.backgroundColor = "#95a5a6";
        }
    }

    function endGame(win) {
        isPlaying = false;
        clearInterval(timerId);
        const msgEl = document.getElementById('message');
        if (win) {
            msgEl.innerText = "¡GANARON! Encontraron todos los peligros a tiempo. 🎉";
            msgEl.style.color = "#2ecc71";
        } else {
            msgEl.innerText = "¡TIEMPO AGOTADO! Los animales los sorprendieron. 💀";
            msgEl.style.color = "#e74c3c";
        }
        document.getElementById('startBtn').innerText = "Jugar de nuevo";
        document.getElementById('startBtn').style.display = 'inline-block';
    }
</script>

</body>
</html>
