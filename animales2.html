<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego: Serpientes del Litoral | B-SAFE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="bg-slate-800/80 border border-slate-700/60 p-6 md:p-10 rounded-2xl shadow-2xl max-w-4xl w-full text-center backdrop-blur-sm">
        
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 mb-4">
            🐍 Misión Litoral: Reconocimiento
        </h1>
        
        <p class="text-lg text-slate-300 mb-2">
            En Corrientes, Misiones, Chaco y Formosa conviven muchas especies.<br>
            <span class="font-bold text-white">Tu equipo debe seleccionar LAS 3 SERPIENTES VENENOSAS</span> antes de evaluar.
        </p>
        
        <div id="message" class="text-xl font-bold text-amber-400 h-8 mt-4 transition-colors duration-300">
            Selecciona 3 especies tocando sus imágenes.
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-8" id="snakeGrid">
        </div>

        <div id="controls" class="mt-10">
            <button id="evalBtn" onclick="evaluateSelection()" disabled
                    class="inline-flex items-center justify-center gap-3 bg-slate-600 text-slate-400 font-extrabold text-lg px-8 py-4 rounded-xl shadow-lg transition-all duration-300 cursor-not-allowed">
                Evaluar Selección
            </button>
        </div>
    </div>

    <script>
        // Base de datos de las serpientes
        const snakes = [
            { id: 'yarara', name: '', isVenomous: true, img: 'img/yarara.jpg' },
            { id: 'nacanina', name: '', isVenomous: false, img: 'img/nacanina.png' },
            { id: 'coral', name: '', isVenomous: true, img: 'img/coral.jfif' },
            { id: 'curiyu', name: '', isVenomous: false, img: 'img/curiyu.jfif' },
            { id: 'cascabel', name: '', isVenomous: true, img: 'img/cascabel.jpeg' },
            { id: 'falsa_coral', name: '', isVenomous: false, img: 'img/falsacoral.png' }
        ];

        let selectedSnakes = [];

        // Generar la grilla visual
        const grid = document.getElementById('snakeGrid');
        
        // Clases de Tailwind para los diferentes estados
        const baseClasses = ['bg-slate-700/50', 'border-4', 'border-transparent', 'rounded-xl', 'p-3', 'cursor-pointer', 'transition-all', 'duration-200', 'hover:scale-105', 'shadow-md'];
        const selectedClasses = ['border-amber-400', 'shadow-[0_0_20px_rgba(251,191,36,0.4)]'];
        const correctClasses = ['border-red-500', 'bg-red-900/60']; // Peligro confirmado
        const wrongClasses = ['border-emerald-500', 'bg-emerald-900/60']; // Inofensiva

        snakes.forEach(snake => {
            const card = document.createElement('div');
            card.classList.add(...baseClasses);
            card.id = snake.id;
            
            // Reemplazo de seguridad para las imágenes que no carguen
            const fallbackSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23475569'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif'>Sin Foto</text></svg>`;

            card.innerHTML = `
                <div class="overflow-hidden rounded-lg mb-3 bg-slate-800">
                    <img src="${snake.img}" alt="${snake.name}" class="w-full h-40 object-cover" onerror="this.src='${fallbackSVG}'">
                </div>
                <h3 class="font-bold text-lg text-slate-100">${snake.name}</h3>
            `;
            card.onclick = () => toggleSelection(snake.id, card);
            grid.appendChild(card);
        });

        function toggleSelection(id, cardElement) {
            const index = selectedSnakes.indexOf(id);
            
            if (index > -1) {
                // Deseleccionar
                selectedSnakes.splice(index, 1);
                cardElement.classList.remove(...selectedClasses);
                cardElement.classList.add('border-transparent');
            } else {
                // Seleccionar (máximo 3)
                if (selectedSnakes.length < 3) {
                    selectedSnakes.push(id);
                    cardElement.classList.remove('border-transparent');
                    cardElement.classList.add(...selectedClasses);
                } else {
                    alert("Ya seleccionaste 3 serpientes. Deselecciona una para cambiar.");
                }
            }

            // Actualizar estilo y estado del botón "Evaluar"
            const evalBtn = document.getElementById('evalBtn');
            if (selectedSnakes.length === 3) {
                evalBtn.disabled = false;
                evalBtn.className = "inline-flex items-center justify-center gap-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-lg px-8 py-4 rounded-xl shadow-lg shadow-amber-500/20 transform hover:-translate-y-0.5 transition-all duration-200 cursor-pointer w-full sm:w-auto";
            } else {
                evalBtn.disabled = true;
                evalBtn.className = "inline-flex items-center justify-center gap-3 bg-slate-700 text-slate-500 font-extrabold text-lg px-8 py-4 rounded-xl shadow-none transition-all duration-300 cursor-not-allowed w-full sm:w-auto";
            }
        }

        function evaluateSelection() {
            let correctCount = 0;

            snakes.forEach(snake => {
                const card = document.getElementById(snake.id);
                const isSelected = selectedSnakes.includes(snake.id);

                // Limpiar clases de selección previa
                card.classList.remove(...selectedClasses);
                card.classList.remove('border-transparent');

                if (isSelected) {
                    if (snake.isVenomous) {
                        card.classList.add(...correctClasses); // Rojo: Peligro
                        correctCount++;
                    } else {
                        card.classList.add(...wrongClasses); // Verde: Inofensiva
                    }
                } else {
                     card.classList.add('border-transparent', 'opacity-50'); // Atenuar las no seleccionadas
                }
                
                // Quitar el evento de click para terminar el juego
                card.onclick = null; 
                card.classList.remove('cursor-pointer', 'hover:scale-105');
            });

            const msgElement = document.getElementById('message');
            const btn = document.getElementById('evalBtn');

            // Darle clases de estilo para el estado final al botón
            btn.className = "inline-flex items-center justify-center gap-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-lg px-8 py-4 rounded-xl shadow-lg shadow-emerald-500/20 transform hover:-translate-y-0.5 transition-all duration-200 mt-4 w-full sm:w-auto";

            // Lógica para victoria o derrota
            if (correctCount === 3) {
                msgElement.classList.replace('text-amber-400', 'text-red-500');
                msgElement.innerText = "¡EXCELENTE! Identificaron correctamente a las 3 especies peligrosas.";
                
                // Cambiar botón a "Seguir" y redirigir
                btn.innerText = "Seguir";
                btn.onclick = () => window.location.href = 'animales3.html';
            } else {
                msgElement.classList.replace('text-amber-400', 'text-orange-400');
                msgElement.innerText = `Cuidado. Acertaron ${correctCount} de 3. Aprendamos a diferenciarlas.`;
                
                // Cambiar botón a "Jugar de Nuevo"
                btn.innerText = "Jugar de Nuevo";
                btn.onclick = () => location.reload();
            }
        }
    </script>
</body>
</html>
