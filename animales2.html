<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Juego: Serpientes del Litoral</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .game-container {
            background-color: #2c3e50;
            border-radius: 15px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        h1 { color: #e67e22; margin-bottom: 10px; }
        p { font-size: 1.1em; color: #bdc3c7; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: #34495e;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 3px solid transparent;
            position: relative;
        }
        .card:hover { transform: scale(1.03); }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            background-color: #7f8c8d; /* Color de fondo por si la imagen no carga */
        }
        .card h3 {
            margin: 10px 0 0 0;
            font-size: 1.1em;
            color: #ecf0f1;
        }
        .selected { border-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        .correct { border-color: #e74c3c; background-color: #c0392b; }
        .wrong { border-color: #2ecc71; background-color: #27ae60; }
        
        #controls { margin-top: 30px; }
        .btn {
            background-color: #e67e22; color: white; border: none;
            padding: 15px 30px; font-size: 1.2em; font-weight: bold;
            border-radius: 5px; cursor: pointer;
        }
        .btn:hover { background-color: #d35400; }
        #message { font-size: 1.3em; font-weight: bold; margin-top: 20px; height: 30px; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐍 Misión Litoral: Reconocimiento</h1>
    <p>En Corrientes, Misiones, Chaco y Formosa conviven muchas especies. <br>
    <strong>Tu equipo debe seleccionar LAS 3 SERPIENTES VENENOSAS</strong> antes de evaluar.</p>
    
    <div id="message">Selecciona 3 especies tocando sus imágenes.</div>

    <div class="grid" id="snakeGrid">
        <!-- Las tarjetas se generan desde JavaScript -->
    </div>

    <div id="controls">
        <button class="btn" id="evalBtn" onclick="evaluateSelection()" disabled>Evaluar Selección</button>
    </div>
</div>

<script>
    // Base de datos de las serpientes
    const snakes = [
        { id: 'yarara', name: 'Yarará', isVenomous: true, img: 'img/yarara.jpg' },
        { id: 'nacanina', name: 'Ñacaniná', isVenomous: false, img: 'img/nacanina.png' },
        { id: 'coral', name: 'Coral', isVenomous: true, img: 'img/coral.jfif' },
        { id: 'curiyu', name: 'Curiyú (Boa)', isVenomous: false, img: 'img/curiyu.jfif' },
        { id: 'cascabel', name: 'Cascabel', isVenomous: true, img: 'img/cascabel.jpeg' },
        { id: 'falsa_coral', name: 'Falsa Coral', isVenomous: false, img: 'img/falsa_coral.png' }
    ];

    let selectedSnakes = [];

    // Generar la grilla visual
    const grid = document.getElementById('snakeGrid');
    
    snakes.forEach(snake => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = snake.id;
        card.innerHTML = `
            <img src="${snake.img}" alt="${snake.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%237f8c8d\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' fill=\\'white\\'>Sin Foto</text></svg>'">
            <h3>${snake.name}</h3>
        `;
        card.onclick = () => toggleSelection(snake.id, card);
        grid.appendChild(card);
    });

    function toggleSelection(id, cardElement) {
        const index = selectedSnakes.indexOf(id);
        
        if (index > -1) {
            // Deseleccionar
            selectedSnakes.splice(index, 1);
            cardElement.classList.remove('selected');
        } else {
            // Seleccionar (máximo 3)
            if (selectedSnakes.length < 3) {
                selectedSnakes.push(id);
                cardElement.classList.add('selected');
            } else {
                alert("Ya seleccionaste 3 serpientes. Deselecciona una para cambiar.");
            }
        }

        // Habilitar botón solo si hay 3 seleccionadas
        const evalBtn = document.getElementById('evalBtn');
        evalBtn.disabled = selectedSnakes.length !== 3;
        evalBtn.style.backgroundColor = selectedSnakes.length === 3 ? '#e67e22' : '#7f8c8d';
    }

    function evaluateSelection() {
        let correctCount = 0;

        snakes.forEach(snake => {
            const card = document.getElementById(snake.id);
            const isSelected = selectedSnakes.includes(snake.id);

            // Reiniciar clases por si evalúan de nuevo
            card.classList.remove('selected', 'correct', 'wrong');

            if (isSelected) {
                if (snake.isVenomous) {
                    card.classList.add('correct'); // Rojo: Peligro confirmado
                    correctCount++;
                } else {
                    card.classList.add('wrong'); // Verde: Era inofensiva
                }
            }
            
            // Quitar el evento de click para terminar el juego
            card.onclick = null; 
        });

        const msgElement = document.getElementById('message');
        if (correctCount === 3) {
            msgElement.style.color = "#e74c3c";
            msgElement.innerText = "¡EXCELENTE! Identificaron correctamente a las 3 especies peligrosas.";
        } else {
            msgElement.style.color = "#f1c40f";
            msgElement.innerText = `Cuidado. Acertaron ${correctCount} de 3. Aprendamos a diferenciarlas.`;
        }

        // Cambiar botón a "Reiniciar"
        const btn = document.getElementById('evalBtn');
        btn.innerText = "Jugar de Nuevo";
        btn.onclick = () => location.reload();
    }
</script>

</body>
</html>
